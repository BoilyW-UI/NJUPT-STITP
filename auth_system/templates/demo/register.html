{% extends 'base.html' %}
{% block title %}注册{% endblock %}
{% block content %}
<div class="row">
    <div class="col-md-6 col-md-offset-3">
        <div class="panel panel-default">
            <div class="panel-heading">
                <h1 class="panel-title">注册</h1>
            </div>
            <div class="panel-body">
                <form id="register-form" method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>邮箱</label>
                        <input type="email" class="form-control" id="reg-email" placeholder="请输入邮箱">
                    </div>
                    <div class="form-group">
                        <label>昵称</label>
                        <input type="text" class="form-control" id="reg-username" placeholder="请输入昵称">
                    </div>
                    <div class="form-group">
                        <label>账号</label>
                        <input type="text" class="form-control" id="reg-id" placeholder="请输入学号或工号">
                    </div>
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" class="form-control" id="reg-password1" placeholder="请输入密码">
                    </div>
                    <div class="form-group">
                        <label>确认密码</label>
                        <input type="password" class="form-control" id="reg-password2" placeholder="请再次输入密码">
                    </div>
                    <button id="reg-submit" type="button" class="btn btn-primary pull-right">提交</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
$('#reg-submit').click(function () {
    $.ajax({
        url: "{% url 'data' 'register' %}",
        type: "post",
        dataType: "json",
        data: {
            username: $('#reg-username').val(),
            email: $('#reg-email').val(),
            password1: $('#reg-password1').val(),
            password2: $('#reg-password2').val(),
            id_num: $('#reg-id').val()
        },
        success: function (data) {
            var errors = data.errors || [];
            if (errors.length === 0) {
                location.href = "{% url 'index' %}";
                return;
            }
            $('.alert').remove();
            var html = '<div class="alert alert-danger">';
            for (var i = 0; i < errors.length; i++) {
                html += errors[i] + '<br/>';
            }
            html += '</div>';
            $('#register-form').before(html);
        }
    });
});
</script>
{% endblock %}
